; Bản Docker của deploy/vps/php-fpm-thiepcuoi.conf (khác: nghe TCP 9000, log ra stderr của container).
[global]
error_log = /proc/self/fd/2

[thiepcuoi]
user = www-data
group = www-data
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
request_terminate_timeout = 310s

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 70M
php_admin_value[memory_limit] = 768M
php_admin_value[max_file_uploads] = 50
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_vars] = 5000
php_admin_value[date.timezone] = Asia/Ho_Chi_Minh
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec
php_admin_value[open_basedir] = /srv/thiepcuoi/:/sites/:/tmp/
