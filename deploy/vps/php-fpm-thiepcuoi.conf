; Pool PHP-FPM riêng cho thiệp cưới. Chép vào /etc/php/<phiên bản>/fpm/pool.d/thiepcuoi.conf
; rồi: sudo systemctl restart php<phiên bản>-fpm
; Giá trị giới hạn lấy theo cờ -d trong run_mac.sh để chạy giống bản trên máy nhà.

[thiepcuoi]
user = www-data
group = www-data
listen = /run/php/thiepcuoi.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
request_terminate_timeout = 310s

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 70M
php_admin_value[memory_limit] = 768M
php_admin_value[max_file_uploads] = 50
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_vars] = 5000
php_admin_value[date.timezone] = Asia/Ho_Chi_Minh
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-thiepcuoi.log
php_admin_flag[expose_php] = off
; Trên VPS không dùng Cloudflare Tunnel nên không cần chạy lệnh hệ thống.
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec
php_admin_value[open_basedir] = /srv/thiepcuoi/:/tmp/
