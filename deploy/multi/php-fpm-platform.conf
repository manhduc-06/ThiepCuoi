; [VPS] Chép vào /etc/php/8.3/fpm/pool.d/platform.conf. Pool riêng cho trang quản trị nền tảng (platform/index.php, tên miền gốc). Khác pool thiepcuoi: được dùng
; proc_open để chạy deploy/multi/cap-doi.sh (tạo/tạm dừng/gỡ cặp đôi). Chỉ Caddy gọi tới socket này.
[platform]
user = www-data
group = www-data
listen = /run/php/platform.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
request_terminate_timeout = 120s

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 110
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[date.timezone] = Asia/Ho_Chi_Minh
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-platform.log
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,pcntl_exec
php_admin_value[open_basedir] = /srv/thiepcuoi/:/srv/sites/:/sites/:/tmp/

; Đổi tenmien.com thành tên miền của bạn (dùng để in link cho từng cặp đôi).
env[BASE_DOMAIN] = tenmien.com
env[SITE_SCHEME] = https
env[SITES_DIR] = /sites
