# Nhiều cặp đôi trên một máy, mỗi cặp một subdomain (deploy/multi/). Thử trên máy:
#   docker compose -f docker-compose.multi.yml up -d --build
#   docker compose -f docker-compose.multi.yml exec -u www-data php bash deploy/multi/cap-doi.sh them lan-hung
#   mở http://lan-hung.localhost:8081/admin
# Dữ liệu từng cặp nằm ở ./sites/<tên>/ trên máy (đã gitignore). Mã nguồn mount chỉ đọc, dùng chung.

name: thiepcuoi-multi

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      THIEPCUOI_MULTI: "1"
      # Trang quản trị nền tảng dùng để in link cho từng cặp đôi.
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      SITE_SCHEME: ${SITE_SCHEME:-http}
      SITE_PORT: ${SITE_PORT-:8081}
    volumes:
      - ./:/srv/thiepcuoi:ro
      - ./sites:/sites
      - logs:/srv/thiepcuoi/application/logs
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/deploy/multi/Caddyfile --adapter caddyfile
    depends_on:
      - php
    ports:
      - "127.0.0.1:8081:80"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      MULTI_SCHEME: http
      MULTI_PORT: ":80"
      TLS_MODE: "off"
      PHP_FPM: "php:9000"
      PLATFORM_FPM: "php:9001"
    volumes:
      - ./deploy:/etc/caddy/deploy:ro
      # Thư mục mỗi cặp có liên kết assets -> /srv/thiepcuoi/assets.
      - ./assets:/srv/thiepcuoi/assets:ro
      - ./platform:/srv/thiepcuoi/platform:ro
      - ./sites:/sites:ro
      - caddy_data_multi:/data
    restart: unless-stopped

  # Cloudflare Tunnel: đưa trang ra tên miền riêng mà không mở cổng router. Token lấy ở Cloudflare Zero Trust,
  # ghi vào file .env (CLOUDFLARE_TUNNEL_TOKEN=...). Chạy kèm: docker compose --profile tunnel up -d
  # Trong Cloudflare, Public Hostname trỏ Service tới  HTTP  caddy:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  logs:
  caddy_data_multi:
